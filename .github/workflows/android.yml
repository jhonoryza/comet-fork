name: android

on:
  pull_request:
    paths: ["apps/android/**", "crates/zeron-loro-android/**", ".github/workflows/android.yml"]
  push:
    branches: [main]
    paths: ["apps/android/**", "crates/zeron-loro-android/**"]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: nttld/setup-ndk@v1
        with: { ndk-version: r26d }
      - uses: gradle/actions/setup-gradle@v3
      - name: Unit + lint
        working-directory: apps/android
        run: |
          gradle :app:testDebugUnitTest --stacktrace
          gradle lint --stacktrace
      - name: Rust host checks
        run: cargo test -p zeron-loro-android --lib

  instrumented:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: nttld/setup-ndk@v1
        with: { ndk-version: r26d }
      - uses: gradle/actions/setup-gradle@v3
      - name: x86_64 native + emulator smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: cd apps/android && gradle :app:connectedDebugAndroidTest --stacktrace

  apk:
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        with: { ndk-version: r26d }
      - uses: gradle/actions/setup-gradle@v3
      - name: Build arm64 internal APK
        working-directory: apps/android
        run: |
          gradle :app:assembleDebug --stacktrace
          unzip -l app/build/outputs/apk/debug/*.apk | grep -E "lib/arm64|lib/x86" || true
          test $(unzip -l app/build/outputs/apk/debug/*.apk | grep -c "lib/arm64") -ge 1
          test $(unzip -l app/build/outputs/apk/debug/*.apk | grep -c "lib/x86_64") -eq 0 || echo "debug may include x86_64; release must not"
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with: { name: zeron-android-debug-apk, path: apps/android/app/build/outputs/apk/debug/*.apk }
